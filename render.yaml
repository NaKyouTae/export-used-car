services:
  # ── Ajucar NestJS Backend ──
  - type: web
    name: ajucar-server
    env: docker
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile.render
    buildFilter:
      paths:
        - server/**
        - Dockerfile.render
        - render.yaml
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
    envVars:
      # Render 포트 설정 (NestJS main.ts 의 PORT 와 일치)
      - key: PORT
        value: "18090"
      - key: NODE_ENV
        value: production

      # Google Play 검토용 테스트 계정 (검토 통과 후 이 두 줄 제거 권장)
      - key: REVIEW_TEST_EMAIL
        value: "google-review@ajucar.com"
      - key: REVIEW_TEST_CODE
        value: "000000"

      # Supabase PostgreSQL 연결 (Dashboard에서 직접 입력)
      - key: DATABASE_URL
        sync: false

      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: "1h"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"

      # Supabase S3 Storage (Dashboard에서 직접 입력)
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      # Supabase Storage 에 실제로 존재하는 버킷명과 반드시 일치해야 한다.
      # (blueprint 의 value 가 대시보드 값을 덮어쓰므로 여기도 같이 관리)
      - key: SUPABASE_S3_BUCKET
        value: ajucar
      - key: SUPABASE_ACCESS_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLIC_URL
        sync: false

      # Email (Nodemailer SMTP) — Naver: 465=암시적 TLS. secure는 코드에서 포트로 유도.
      - key: SMTP_HOST
        value: smtp.naver.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Admin
      - key: ADMIN_TOKEN
        sync: false
