services:
  # ── Ajucar NestJS Backend ──
  - type: web
    name: ajucar-server
    env: docker
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile.render
    buildFilter:
      paths:
        - server/**
        - Dockerfile.render
        - render.yaml
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
    envVars:
      # Render 포트 설정 (NestJS main.ts 의 PORT 와 일치)
      - key: PORT
        value: "18090"
      - key: NODE_ENV
        value: production

      # Supabase PostgreSQL 연결 (Dashboard에서 직접 입력)
      - key: DATABASE_URL
        sync: false

      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: "1h"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"

      # Supabase S3 Storage (Dashboard에서 직접 입력)
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: exports
      - key: SUPABASE_ACCESS_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLIC_URL
        sync: false

      # Email (Nodemailer SMTP)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Admin
      - key: ADMIN_TOKEN
        sync: false
